<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customizer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a66;
    --line: #e3e1db;
    --accent: #c2410c;
    --accent-soft: #fbe9df;
    --viewer: #0d0d0d;
    --grid: #ffffff;
    --model: #ffffff;
    --danger: #b42318;
    --warning: #b54708;
    --wordmark-braces: #12141a;
    --wordmark-letters: #12141a;
    --on-accent: #fff;
    --axis-x: #ff453a; --axis-y: #30d158; --axis-z: #0a84ff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --panel: #1f1f1d;
      --text: #ecebe7;
      --muted: #9c9a94;
      --line: #33322f;
      --accent: #f08a4b;
      --accent-soft: #3a2519;
      --danger: #f97066;
      --warning: #fdb022;
      --wordmark-braces: #ff6347;
      --wordmark-letters: #f6f3ec;
      --on-accent: #000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --panel: #1f1f1d; --text: #ecebe7; --muted: #9c9a94; --line: #33322f;
    --accent: #f08a4b; --accent-soft: #3a2519; --danger: #f97066; --warning: #fdb022;
    --wordmark-braces: #ff6347; --wordmark-letters: #f6f3ec; --on-accent: #000;
    color-scheme: dark;
  }

  /* The page fills the whole screen, under a phone's camera housing and home indicator too, and keeps
     its content within the safe area that leaves clear */
  :root {
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: minmax(calc(300px + var(--safe-left)), calc(360px + var(--safe-left))) 1fr;
    grid-template-rows: 100%;
  }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header { padding: calc(20px + var(--safe-top)) 20px 12px calc(20px + var(--safe-left)); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tabs[hidden] { display: none; }
  .tabs button {
    font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .tabs button[aria-selected="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  #model-menu { margin-top: 14px; font-weight: 600; }
  #model-menu[hidden] { display: none; }
  .model-description { color: var(--muted); font-size: 13px; margin: 8px 0 4px; }

  form { flex: 1; overflow-y: auto; padding: 4px 20px 16px calc(20px + var(--safe-left)); }
  .field { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: none; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .field label { font-weight: 600; font-size: 14px; }
  .field .help { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .field .control { margin-top: 8px; display: flex; align-items: center; gap: 10px; }

  input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
  input[type="number"], input[type="text"], select {
    font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  input[type="number"] { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="text"], select { width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .unit { color: var(--muted); font-size: 13px; margin-left: -6px; }

  .segmented { display: flex; width: 100%; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .segmented button {
    flex: 1; font: inherit; font-size: 13.5px; padding: 5px 6px; border: none; background: transparent;
    color: var(--text); cursor: pointer; border-right: 1px solid var(--line);
  }
  .segmented button:last-child { border-right: none; }
  .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .toggle { position: relative; width: 40px; height: 22px; flex: none; cursor: pointer; }
  /* The checkbox covers the switch it draws. WebKit keeps a positioned checkbox at its own small
     size unless it's sized explicitly, which left most of the switch unclickable in Safari. */
  .toggle input {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .toggle span {
    position: absolute; inset: 0; border-radius: 11px; background: var(--line); transition: background .15s;
    pointer-events: none;
  }
  .toggle span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25);
  }
  .toggle input:checked + span { background: var(--accent); }
  .toggle input:checked + span::after { transform: translateX(18px); }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { padding: 14px 20px calc(18px + var(--safe-bottom)) calc(20px + var(--safe-left)); border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .actions { display: flex; gap: 8px; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  /* Disabled, but not yet for long enough to look it, so that quick rebuilds don't make it flicker */
  #download.held:disabled { opacity: 1; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #status { font-size: 13px; color: var(--danger); }
  #status[hidden] { display: none; }
  #build-time, #memory { margin-top: 6px; font-variant-numeric: tabular-nums; }
  #memory[hidden] { display: none; }
  details { font-size: 12.5px; color: var(--muted); }
  #log {
    max-height: 240px; overflow: auto; margin: 8px 0 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #log:empty { display: none; }
  /* A message that wraps is indented, so that it doesn't read as the next one */
  #log > div { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 2ch; text-indent: -2ch; }
  #log > div + div { margin-top: 2px; }
  #log .warning { color: var(--warning); }
  #log .error { color: var(--danger); }

  /* Floats over the model view, so it gets a translucent panel of its own */
  .credit {
    position: fixed; top: calc(14px + var(--safe-top)); right: calc(14px + var(--safe-right)); display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 13px; text-decoration: none;
    background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .credit:hover { color: var(--text); }
  .credit svg { height: 31px; width: auto; display: block; margin: -5px 0; }
  .cadova-braces { stroke: var(--wordmark-braces); }
  .cadova-letters { fill: var(--wordmark-letters); }

  main { position: relative; background: var(--viewer); color: #ffffff; min-width: 0; min-height: 0; }
  .stage { position: absolute; inset: 0; }
  #viewer { position: absolute; inset: 0; overflow: hidden; }
  #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Zoom and reset buttons, floating over the model view's top-left corner */
  .view-controls {
    position: absolute; top: calc(14px + var(--safe-top)); left: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .view-controls[hidden] { display: none; }
  .view-controls button {
    width: 36px; height: 36px; padding: 0; border-radius: 50%; cursor: pointer; touch-action: manipulation;
    display: grid; place-items: center; color: var(--text);
    background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line);
  }
  .view-controls button:hover { background: var(--panel); }
  .view-controls svg {
    width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Bigger on a touch screen, where they're tapped with a finger */
  @media (pointer: coarse) {
    .view-controls button { width: 42px; height: 42px; }
    .view-controls svg { width: 20px; height: 20px; }
  }

  #axis-indicator {
    position: absolute; left: 16px; bottom: calc(16px + var(--safe-bottom)); width: 110px; height: 110px;
    pointer-events: none; filter: drop-shadow(0 0 2px black);
  }
  #axis-indicator line { stroke-width: 1; }
  #axis-indicator line[data-axis="x"] { stroke: var(--axis-x); }
  #axis-indicator line[data-axis="y"] { stroke: var(--axis-y); }
  #axis-indicator line[data-axis="z"] { stroke: var(--axis-z); }
  #axis-indicator text { fill: currentColor; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  #overlay {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
    color: #9c9a94; pointer-events: none;
  }
  #overlay[hidden] { display: none; }
  .progress { width: 220px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .viewer-actions {
    position: absolute; right: calc(16px + var(--safe-right)); bottom: calc(16px + var(--safe-bottom));
    max-width: calc(100% - 32px - var(--safe-right));
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 10px;
  }
  .viewer-actions button.primary {
    font-size: 16px; padding: 12px 22px; border-radius: 10px; box-shadow: 0 2px 10px rgb(0 0 0 / .18);
  }
  #build-progress {
    display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
  }
  #build-progress[hidden] { display: none; }
  #cancel {
    font: inherit; color: var(--accent); cursor: pointer; background: transparent;
    border: none; border-left: 1px solid var(--line); padding: 2px 0 2px 10px;
  }

  /* On a short screen, such as a phone on its side, the whole sidebar scrolls as one, rather than
     leaving the settings a sliver between a fixed heading and footer */
  @media (max-height: 500px) {
    aside { overflow-y: auto; }
    form { flex: none; overflow: visible; }
    footer { padding-bottom: 18px; }
  }

  /* Download and the credit, when they're moved into the sidebar on a short screen: Download in a
     bar along its bottom, always in reach, and the credit at the end of its settings */
  aside .viewer-actions {
    position: sticky; bottom: 0; right: auto; max-width: none; flex-wrap: nowrap;
    padding: 10px 20px calc(10px + var(--safe-bottom)) calc(20px + var(--safe-left));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  aside .viewer-actions button.primary { flex: 1; box-shadow: none; font-size: 15px; padding: 10px 14px; }
  aside .credit { position: static; align-self: center; margin: 4px 0 16px var(--safe-left); }

  /* On a phone held upright, the model view goes above the settings, with Download in a bar right
     below it, and the credit moves to the end of the page, out of the view's way. A phone on its
     side keeps the columns, since stacking would leave the view wide and thin. */
  @media (max-width: 760px) and (orientation: portrait), (max-width: 540px) {
    body { grid-template-columns: 100%; grid-template-rows: auto auto auto; height: auto; min-height: 100%; }
    main { grid-row: 1; display: flex; flex-direction: column; }
    .stage { position: relative; inset: auto; height: 62vh; height: 62svh; }
    #axis-indicator { bottom: 16px; }
    .viewer-actions {
      position: static; max-width: none; flex-wrap: nowrap;
      padding: 10px calc(16px + var(--safe-right)) 10px calc(16px + var(--safe-left));
      background: var(--panel); color: var(--text);
    }
    .viewer-actions button.primary { flex: 1; box-shadow: none; }
    aside { grid-row: 2; border-right: none; border-top: 1px solid var(--line); }
    header, form, footer {
      padding-left: calc(16px + var(--safe-left)); padding-right: calc(16px + var(--safe-right));
    }
    header { padding-top: 20px; }
    footer { padding-bottom: 18px; }
    form { overflow: visible; }
    .credit { position: static; grid-row: 3; justify-self: center; margin: 4px 0 calc(24px + var(--safe-bottom)); }
  }
</style>
</head>
<body>
  <aside>
    <header>
      <h1 id="title">Customizer</h1>
      <div class="subtitle" id="subtitle">Adjust the parameters, then download the model.</div>
      <div class="tabs" id="models" role="tablist" aria-label="Models" hidden></div>
      <select id="model-menu" aria-label="Model" hidden></select>
    </header>
    <form id="parameters" autocomplete="off"></form>
    <footer>
      <div id="status" role="alert" hidden></div>
      <div class="actions">
        <button type="button" class="secondary" id="reset" disabled>Reset</button>
        <button type="button" class="secondary" id="retry" hidden>Retry loading</button>
      </div>
      <details>
        <summary>Details</summary>
        <div id="build-time">Not built yet</div>
        <div id="memory" hidden></div>
        <div id="log" role="log"></div>
      </details>
    </footer>
  </aside>
  <main>
    <div class="stage">
      <div id="viewer"></div>
      <div class="view-controls" id="view-controls" role="toolbar" aria-label="View" hidden>
        <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" id="reset-view" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9"/></svg>
        </button>
      </div>
      <div id="overlay">
        <div id="overlay-text">Loading model…</div>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>
    </div>
    <div class="viewer-actions">
      <div id="build-progress" hidden>
        <span id="building" role="status" hidden>Building…</span>
        <button type="button" id="cancel" hidden>Cancel</button>
      </div>
      <button type="button" class="primary" id="download" disabled>Download Model</button>
    </div>
  </main>
  <a class="credit" href="https://cadova.org" target="_blank" rel="noopener" aria-label="Made with Cadova">

  </a>
  <script>
    // When any of the page's code fails to load, from here or the CDN, none of it runs. Say so and
    // offer to reload, rather than staying on "Loading model…".
    function showLoadingFailure() {
      const $ = (id) => document.getElementById(id);
      const message = "Couldn't load the page. Check your connection, then reload.";
      $("overlay-text").textContent = message;
      $("progress-bar").parentElement.hidden = true;
      $("status").textContent = message;
      $("status").hidden = false;
      $("retry").textContent = "Reload";
      $("retry").hidden = false;
      $("retry").onclick = () => location.reload();
    }
  </script>
  <script type="module" src="customizer.js" onerror="showLoadingFailure()"></script>
</body>
</html>
